[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-faq-rag-search"
version = "0.1.0"
description = "Hybrid FAQ retrieval with BM25, SentenceTransformer embeddings, CrossEncoder reranking, and Recall@K/MRR evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Hadis Arefanjazi" }
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0"
]

[project.scripts]
smart-faq = "smart_faq.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
